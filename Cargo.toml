[workspace]
resolver = "3"
members = ["crates/koan-push-relay", "crates/koan-relay-client"]

[workspace.package]
# One version for the relay, the client and the Pulumi package: they are
# released together.
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/radiosilence/koan-push-relay"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
