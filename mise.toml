[tools]
# rustfmt and clippy are not in the minimal profile.
rust = { version = "latest", components = "rustfmt,clippy" }
just = "latest"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
lefthook = "latest"
node = "24"
# Exact: the lockfile format and its resolution follow aube's version.
aube = "2.8.5"
